<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAB EDI monitor</title>
  <link rel="stylesheet" href="/style.css?v=20260712-2">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow" data-i18n="eyebrow">DAB MONITORING</p>
        <h1 data-i18n="title">EDI webový přehrávač</h1>
      </div>
      <span id="ediBadge" class="badge bad">EDI offline</span>
    </header>

    <section class="player-card">
      <label for="station" data-i18n="station" hidden>Stanice</label>
      <select id="station" hidden></select>
      <audio id="audio" controls preload="none"></audio>
      <div class="buttons">
        <button id="play" data-i18n="play">Přehrát / znovu připojit</button>
        <button id="restart" class="secondary" data-i18n="restart">Restart dekodéru</button>
      </div>
      <p id="message" class="message"></p>
    </section>

    <section class="grid">
      <article>
        <h2 data-i18n="ediInput">EDI vstup</h2>
        <dl id="ediStatus"></dl>
      </article>
      <article>
        <h2 data-i18n="decoder">Dekodér stanice</h2>
        <dl id="stationStatus"></dl>
      </article>
    </section>

    <section class="log-card" hidden>
      <h2 data-i18n="diagnostics">Poslední diagnostika</h2>
      <pre id="diagnostic" data-i18n="waiting">Čekám na stav…</pre>
    </section>
  </main>
  <script src="/app.js?v=20260712-3"></script>
</body>
</html>
