<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAB EDI probe</title>
  <link rel="stylesheet" href="/style.css?v=20260713-1">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">DAB PROBE</p>
        <h1 data-i18n="title">EDI stream probe</h1>
      </div>
      <span id="probeBadge" class="badge bad" data-i18n="disconnected">Nepřipojeno</span>
    </header>

    <section class="player-card">
      <form id="probeForm" class="probe-form">
        <label>
          <span data-i18n="host">IP adresa / host</span>
          <input id="host" name="host" autocomplete="off" required placeholder="93.185.96.156">
        </label>
        <label>
          <span data-i18n="port">Port</span>
          <input id="port" name="port" type="number" min="1" max="65535" required placeholder="15000">
        </label>
        <label>
          <span data-i18n="format">Formát</span>
          <select id="format" name="format">
            <option value="edi">EDI AF</option>
            <option value="eti">ETI-NI</option>
          </select>
        </label>
        <label>
          <span data-i18n="discovery">Discovery</span>
          <input id="discoverSeconds" name="discoverSeconds" type="number" min="1" max="60" value="8">
        </label>
        <button id="probeButton" type="submit" data-i18n="loadStations">Načíst stanice</button>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="grid">
      <article>
        <h2 data-i18n="foundStations">Nalezené stanice</h2>
        <div id="services" class="station-list"></div>
      </article>
      <article>
        <h2 data-i18n="playback">Přehrávání</h2>
        <audio id="audio" controls preload="none"></audio>
        <dl id="playbackStatus"></dl>
        <div id="metadataPanel" class="metadata-panel no-slide probe-metadata-panel">
          <img id="slideImage" class="slide-image" alt="" hidden>
          <div class="metadata-copy">
            <h2 data-i18n="nowPlaying">Právě hraje</h2>
            <p id="dynamicLabel" class="dynamic-label" data-i18n="noMetadata">Bez textových metadat.</p>
            <dl id="dlPlus" class="dl-plus"></dl>
          </div>
        </div>
      </article>
    </section>

    <section class="grid">
      <article>
        <h2 data-i18n="ediInput">EDI vstup</h2>
        <dl id="ediStatus"></dl>
      </article>
      <article>
        <h2 data-i18n="decoder">Dekodér stanice</h2>
        <dl id="stationStatus"></dl>
      </article>
    </section>
  </main>
  <script src="/probe.js?v=20260713-3"></script>
</body>
</html>
