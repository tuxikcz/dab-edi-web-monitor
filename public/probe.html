<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DAB EDI probe</title>
  <link rel="stylesheet" href="/style.css?v=20260713-1">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">DAB PROBE</p>
        <h1>EDI stream probe</h1>
      </div>
      <span id="probeBadge" class="badge bad">Nepřipojeno</span>
    </header>

    <section class="player-card">
      <form id="probeForm" class="probe-form">
        <label>
          IP adresa / host
          <input id="host" name="host" autocomplete="off" required placeholder="93.185.96.156">
        </label>
        <label>
          Port
          <input id="port" name="port" type="number" min="1" max="65535" required placeholder="15000">
        </label>
        <label>
          Formát
          <select id="format" name="format">
            <option value="edi">EDI AF</option>
            <option value="eti">ETI-NI</option>
          </select>
        </label>
        <label>
          Discovery
          <input id="discoverSeconds" name="discoverSeconds" type="number" min="1" max="60" value="8">
        </label>
        <button id="probeButton" type="submit">Načíst stanice</button>
      </form>
      <p id="message" class="message"></p>
    </section>

    <section class="grid">
      <article>
        <h2>Nalezené stanice</h2>
        <div id="services" class="station-list"></div>
      </article>
      <article>
        <h2>Přehrávání</h2>
        <audio id="audio" controls preload="none"></audio>
        <dl id="playbackStatus"></dl>
      </article>
    </section>

    <section class="grid">
      <article>
        <h2>EDI vstup</h2>
        <dl id="ediStatus"></dl>
      </article>
      <article>
        <h2>Dekodér stanice</h2>
        <dl id="stationStatus"></dl>
      </article>
    </section>
  </main>
  <script src="/probe.js?v=20260713-1"></script>
</body>
</html>
